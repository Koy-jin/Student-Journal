name: CI Pipeline

on: 
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main"]


jobs:
  build-add-test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Lint Python code with Ruff
        run: |
          pip install ruff
          ruff check . --select E9,F63,F7,F82

      - name: 4. Create test .env file
        run: cp .env.example .env 

      - name: 5. Build and start Docker Compose
        run: docker compose up -d --build

      - name: 6. Wait and check endpoints
        run: | 
          sleep 10
          docker compose ps
          curl -f http://localhost/
          curl -f http://localhost/apidocs/

      - name: 7. Stop and clean up containers
        if: always()
        run: docker compose down -v 

  build-and-push:
    needs: build-add-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
    
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 3. Extract Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/student-journal-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      
      - name: 4. Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      
      - name: 5. Extact Docker metadata for frontend
        id: meta-front
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/student-journal-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: 6. Build an Push Docke image frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: ${{ steps.meta-front.outputs.tags }}
          labels: ${{ steps.meta-front.outputs.labels }}