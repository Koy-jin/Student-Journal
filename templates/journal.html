<!doctype html>
<html xmlns="http://www.w3.org/1999/html">
    <head>
        <meta charset="utf-8"/>
        <title>Тестовая страница</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    <nav class="nav-admin">
        <button class="btn-nav-log-out" id="btn-log-out" style="display: block;">Log out</button>
        <button class="current-op" id="btn-nav-subjects" disabled>Журнал</button>
        <button class="btn-nav" id="btn-nav-users">Управление пользователям</button>
        <button class="btn-nav" id="btn-nav-groups">Управление группами</button>
        <button class="btn-nav" id="btn-nav-subjects">Управление предметами</button>
        <script src="admin_btn_nav.js"></script>
    </nav>
    <main>
        <nav id="nav-subject">
            <label>Выберите группу:</label>
            <select id="select-group">
                <option value="N/A">N/A</option>
            </select>
        </nav>

        <div class="div-journal" id="div-switcher-subject-btn"></div>
        <div class="div-journal" id="div-m-options">
            <button class="btn-m-options" id="btn-open-add-topic">Добавить тему занятий</button>
            <button class="btn-m-options" id="btn-delete-topic">Удалить тему занятий</button>
            <button class="btn-m-options" id="btn-marks-edit"> Редактировать оценку</button>
        </div>
        <div class="div-journal" id="div-delete-form" style="display: none;">
            <select id="select-delete-topic"></select>
            <button class="btn-m-options" id="btn-accept-delete">Удалить</button>
            <button class="btn-m-options" id="btn-accept-delete-cancel">Отмена</button>
        </div>
        <div class="div-journal" id="div-edd">
            <button class="btn-m-options" id="btn-marks-edit-push">Сохронить</button>
            <button class="btn-m-options" id="btn-marks-edit-cancel">Отменить</button>
        </div>
        <form id="topic-form">
                <div class="div-journal" id="nav-block-add-topic">
                    <input type="text" id="input-add-topic">
                    <button class="btn-m-options" type="submit" id="btn-add-topic">Добавить</button>
                    <button class="btn-m-options" type="button" id="btn-add-topic-cancel">отмена</button>
                </div>
        </form>
        <table id="table">
            <thead id="tr-headers">
            </thead>
            <tbody id="tbody-students"></tbody>
        </table>
        <script src="admin_journals.js" defer></script>
    </main>

    </body>
</html>
