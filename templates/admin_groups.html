<!doctype html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>Тестовая страница</title>
    </head>
    <body>
    <nav>
        <h3><button id="btn-log-out">Log out</button></h3>
        <button id="btn-nav-journal">Журнал</button>
        <button id="btn-nav-users">Управление пользователям</button>
        <button id="btn-nav-groups">Управление группами</button>
        <button id="btn-nav-subjects">Управление предметами</button>
        <script src="admin_btn_nav.js"></script>
    </nav>
    <main>
        <nav>
            <text id="text-no-one-group">Ещё не созданно не одной группы</text>

            <div id="div-nav-btns">
                <button id="btn-create-group">Создать группу</button>
                <button id="btn-add-subject-on-group">Назначить предмет</button>
            </div>
            <div id="div-add-group">
                <input id="input-group-name"  type="text">
                <button id="btn-add-group" >Добавить группу</button>
                <button class="cancel">Отмена</button>
            </div>
            <form id="courses-form">
                <div id="div-add-subject">
                    <label>выберите группу</label>
                    <select id="select-group"></select>
                    <label>выберите предмет</label>
                    <select id="select-subject"></select>
                    <button id="btn-add-courses">Добавить</button>
                    <button type="submit" class="cancel">Отмена</button>
                </div>
            </form>

        </nav>
        <table id="table-student-list">
            <thead>Номер</thead>
            <tbody></tbody>
        </table>
        <script src="admin_groups.js"></script>
    </main>
    </body>
</html>
